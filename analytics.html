<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Query Analytics</title>
    <link rel="stylesheet" href="analytics.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons for minimal SVG icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-title">
                <h1>Faculty Query Analytics</h1>
                <p id="faculty-info"></p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary"><i data-lucide="sliders-horizontal"></i> Filter</button>
                <button class="btn btn-secondary"><i data-lucide="download"></i> Export Data</button>
            </div>
        </header>

        <!-- KPI Cards -->
        <section class="kpi-cards">
            <div class="card">
                <div class="card-title">TOTAL QUERIES</div>
                <div class="card-body">
                    <div class="card-value" id="total-queries-val"></div>
                    <div class="card-trend" id="total-queries-trend"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">UNRESOLVED QUERIES</div>
                <div class="card-body">
                    <div class="card-value" id="unresolved-queries-val"></div>
                    <div class="card-trend" id="unresolved-queries-trend"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">AVG RESPONSE TIME</div>
                <div class="card-body">
                    <div class="card-value" id="avg-response-time-val"></div>
                    <div class="card-trend" id="avg-response-time-trend"></div>
                </div>
            </div>
        </section>

        <!-- Diagnostics Section -->
        <section class="diagnostics-section">
            <div class="diagnostics-header">
                <span class="diagnostics-subtitle">DIAGNOSTICS</span>
                <h2>Top Student Struggle Topics</h2>
            </div>
            <div class="diagnostics-list" id="diagnostics-list">
                <!-- Data will be populated here dynamically -->
                <!-- Template Item: 
                <div class="diagnostics-item">
                    <div class="item-left">
                        <span class="item-rank"></span>
                        <span class="item-name"></span>
                    </div>
                    <div class="item-right">
                        <span class="item-value"></span>
                        <span class="item-label">queries</span>
                    </div>
                </div>
                -->
            </div>
        </section>

        <!-- Bottom Grid -->
        <section class="bottom-grid">
            <!-- Recent Unresolved Queries -->
            <div class="recent-queries">
                <div class="section-header">
                    <h3>Recent Unresolved Queries</h3>
                    <span class="badge" id="priority-queries-badge"></span>
                </div>
                <div class="query-list" id="recent-queries-list">
                    <!-- Data will be populated here dynamically -->
                    <!-- Template Item:
                    <div class="query-item">
                        <div class="query-user">
                            <span class="query-user-name"></span>
                            <span class="query-user-course"></span>
                        </div>
                        <div class="query-text"></div>
                        <div class="query-time"></div>
                    </div>
                    -->
                </div>
            </div>

            <!-- Vertical Divider -->
            <div class="vertical-divider"></div>

            <!-- Query Volume by Course -->
            <div class="query-volume">
                <div class="section-header">
                    <h3>Query Volume by Course</h3>
                </div>
                <div class="volume-list" id="volume-list">
                    <!-- Data will be populated here dynamically -->
                    <!-- Template Item:
                    <div class="volume-item">
                        <div class="volume-course"></div>
                        <div class="volume-bar-container">
                            <div class="volume-bar" style="width: 0%;"></div>
                        </div>
                        <div class="volume-value"></div>
                    </div>
                    -->
                </div>
                
                <div class="insight-card">
                    <div class="insight-title">DISTRIBUTION INSIGHT</div>
                    <p id="distribution-insight-text"></p>
                </div>
            </div>
        </section>
    </div>

    <script>
        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
